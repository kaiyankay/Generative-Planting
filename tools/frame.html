<!doctype html>
<html lang="en"><head><meta charset="utf-8"><title>Viewport frame (screenshots)</title>
<style>html,body{margin:0;background:#fff;overflow:hidden}iframe{border:0;display:block}</style></head>
<body><iframe id="f"></iframe>
<script>
// Screenshot helper: renders ../<src> in an iframe of exactly w × h CSS px (headless Chrome cannot make a window narrower than ~500 px).
const q = new URLSearchParams(location.search); const f = document.getElementById('f');
f.width = +q.get('w') || 390; f.height = +q.get('h') || 844; f.src = '../' + (q.get('src') || 'index.html');
</script></body></html>
