<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Model tests — Generative Planting</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
  body { font: 13px/1.4 -apple-system, system-ui, sans-serif; background: #F3EFE5; color: #2E3328; margin: 16px; }
  iframe { border: 1px solid #ccc; background: #fff; }
  #frames { display: flex; gap: 12px; align-items: flex-start; flex-wrap: wrap; }
  .pass { color: #3c6b2f; } .fail { color: #b0322a; font-weight: 600; }
  pre { white-space: pre-wrap; }
</style>
</head>
<body>
<h1 style="font-size:18px">In-browser tests: the real app in an iframe, driven through <code>window.GP</code>, real pointer events and canvas pixels</h1>
<p id="summary">running…</p>
<pre id="out"></pre>
<div id="frames">
  <iframe id="desk" width="1440" height="900" style="transform:scale(.4);transform-origin:0 0;margin-right:-864px;margin-bottom:-540px"></iframe>
  <iframe id="phone" width="390" height="844" style="transform:scale(.4);transform-origin:0 0;margin-right:-234px;margin-bottom:-506px"></iframe>
</div>
<script type="module">
const out = document.getElementById('out');
const res = [];
const log = (name, ok, detail = '') => { res.push({ name, ok: !!ok, detail: String(detail) }); out.innerHTML += `<span class="${ok ? 'pass' : 'fail'}">${ok ? 'PASS' : 'FAIL'}</span> ${name}${ok ? '' : ' — ' + detail}\n`; };
const sleep = (ms) => new Promise((r) => setTimeout(r, ms));
const base = location.pathname.replace(/tests\.html$/, '');

async function boot(frame, url) {
  const errors = [];
  frame.src = url;
  await new Promise((r) => frame.addEventListener('load', r, { once: true }));
  const w = frame.contentWindow;
  w.addEventListener('error', (e) => errors.push(e.message));
  const ce = w.console.error.bind(w.console); w.console.error = (...a) => { errors.push(a.join(' ')); ce(...a); };
  for (let i = 0; i < 200 && !(w.document.documentElement.dataset.ready === '1'); i++) await sleep(100);
  return { w, errors, GP: w.GP };
}

try {
  try { localStorage.clear(); } catch {} // same origin as the app: start without a persisted working design
  const t0 = performance.now();
  const { w, errors, GP } = await boot(document.getElementById('desk'), base + 'index.html?view=3d');
  const loadMs = performance.now() - t0;
  log('app loads and exposes window.GP', !!GP, 'no GP');
  log('loaded under base path ' + base, w.location.pathname.startsWith(base));
  const S = GP._store, plan = GP._plan, scene = GP._scene;

  // ---- data
  const beds = S.beds.filter((b) => 'ABC'.includes(b.props.style));
  log('15 main beds with unique ids', beds.length === 15 && new Set(beds.map((b) => b.id)).size === 15, beds.length);
  log('all assets resolved by relative URL (model, instances, terrain)', S.instanceCount > 1000 && S.terrain.data.length > 1000);

  // ---- unknown stays unknown
  const c = GP.sampleConditions(0, 0);
  log('sun / moisture / pH return null + unknown (not 0)', ['field.sun', 'field.moisture', 'field.ph'].every((k) => c[k].value === null && c[k].status === 'unknown'), JSON.stringify(c['field.sun']));
  log('elevation sampled from 3DEP inside extent', typeof c['field.elevation'].value === 'number' && c['field.elevation'].value > 170 && c['field.elevation'].value < 182, c['field.elevation'].value);
  log('elevation outside extent is unknown', GP.sampleConditions(5000, 5000)['field.elevation'].value === null);

  // ---- spatial query
  const a1 = GP.getObject('bed.A1');
  const cen = (() => { const r = a1.geometry.coordinates[0]; let x = 0, y = 0; r.slice(0, -1).forEach((p) => { x += p[0]; y += p[1]; }); return [x / (r.length - 1), y / (r.length - 1)]; })();
  log('getBedAt(centroid of A1) = bed.A1', GP.getBedAt(cen[0], cen[1])?.id === 'bed.A1');
  log('queryObjects(type bed, style B) = 6', GP.queryObjects({ bbox: [-500, -500, 500, 500] }, { type: 'bed', style: 'B' }).length === 6);
  const ctx = GP.getPlantingContext('bed.B1');
  log('getPlantingContext(B1) lists Sporobolus matrix', ctx.species.some((s) => s.id === 'sp.sporobolus-heterolepis') && ctx.placementsByRole.matrix === 1, JSON.stringify(ctx.placementsByRole));

  // ---- layers: hide trees -> invisible in 3D, data intact, others unaffected
  const nTrees = S.model.objects.filter((o) => o.type === 'tree').length;
  const treeMeshes = scene.plantMeshes.filter((m) => m.userData.layer === 'veg.trees');
  GP.setLayer('veg.trees', { visible: false });
  log('hide trees: 3D tree meshes hidden', treeMeshes.length > 0 && treeMeshes.every((m) => !m.visible));
  log('hide trees: tree data not deleted', S.model.objects.filter((o) => o.type === 'tree').length === nTrees && S.instanceCount === GP._store.instanceCount);
  log('hide trees: grasses still visible', scene.plantMeshes.filter((m) => m.userData.layer === 'veg.grasses' && m.userData.lod !== 'near').every((m) => m.visible));
  GP.setLayer('veg.trees', { visible: true });
  log('show trees again', treeMeshes.every((m) => m.visible));
  GP.setLayer('veg', { visible: false });
  log('group toggle hides children (forbs)', !S.layerVisible('veg.forbs') && S.layerState['veg.forbs'].visible === true);
  GP.setLayer('veg', { visible: true });

  // ---- lock: locked beds are not selectable, still visible
  GP.setLayer('structure.beds', { locked: true });
  GP.select(null); GP._store.select(null);
  w.GP._plan; const pk = scene.picker;
  pk.clickAt(cen[0], cen[1], 8);
  log('locked bed layer: click does not select the bed', S.selection?.id !== 'bed.A1', S.selection?.id);
  log('locked layer stays visible', S.layerVisible('structure.beds'));
  GP.setLayer('structure.beds', { locked: false });
  GP.select(null);

  // ---- selection sync 2D <-> 3D and drill-down
  pk.clickAt(cen[0], cen[1], 8);
  log('click selects bed A1', S.selection?.id === 'bed.A1', S.selection?.id);
  log('3D shows the selection outline', scene.selGroup.children.length > 0);
  log('3D dims plants outside A1', scene.iDim.some((d) => d > 0) && scene.iDim.some((d) => d === 0));
  pk.clickAt(cen[0], cen[1], 8);
  const sel2 = S.selection?.id || '';
  log('second click drills down to a patch / plant of A1', sel2.startsWith('pl.A1.') || sel2.startsWith('pi.'), sel2);
  GP.setView('plan'); await sleep(200);
  log('switching to Plan keeps the selection', S.selection?.id === sel2);
  log('inspector open', !w.document.getElementById('inspector').hidden);
  pk.up(); if (sel2.startsWith('pi.')) pk.up();
  log('select parent climbs to the bed', S.selection?.id === 'bed.A1', S.selection?.id);
  w.dispatchEvent(new w.KeyboardEvent('keydown', { key: 'Escape' }));
  log('Esc clears the selection', S.selection === null);

  // ---- plan zoom / pan / fit
  plan.fit(); const v0 = { ...plan.view };
  const cv = w.document.getElementById('c2d');
  cv.dispatchEvent(new w.WheelEvent('wheel', { deltaY: -400, clientX: 700, clientY: 450, bubbles: true, cancelable: true }));
  log('wheel zooms the plan', plan.view.scale > v0.scale * 1.5, plan.view.scale + ' vs ' + v0.scale);
  cv.dispatchEvent(new w.PointerEvent('pointerdown', { clientX: 700, clientY: 450, pointerId: 1, bubbles: true }));
  cv.dispatchEvent(new w.PointerEvent('pointermove', { clientX: 600, clientY: 400, pointerId: 1, buttons: 1, bubbles: true }));
  cv.dispatchEvent(new w.PointerEvent('pointerup', { clientX: 600, clientY: 400, pointerId: 1, bubbles: true }));
  log('drag pans the plan', Math.abs(plan.view.cx - v0.cx) > 1 || Math.abs(plan.view.cy - v0.cy) > 1);
  plan.fit();
  log('fit resets the plan view', Math.abs(plan.view.scale - v0.scale) < 1e-6 && Math.abs(plan.view.cx - v0.cx) < 1e-6);

  // ---- 3D camera reset
  GP.setView('3d'); await sleep(100);
  const z0 = scene.cam.zoom, p0 = scene.cam.position.clone();
  scene.cam.zoom = 3; scene.cam.position.x += 30; scene.cam.updateProjectionMatrix();
  scene.home();
  log('3D home() resets the camera', Math.abs(scene.cam.zoom - z0) < 1e-6 && scene.cam.position.distanceTo(p0) < 1e-3);

  // ---- exploded layer view is reversible and does not touch data
  const camBefore = scene.cam.position.clone();
  scene.setExploded(true, true);
  log('exploded: vegetation lifted, structure plane shown', scene.plantMeshes.every((m) => m.position.y > 1) && scene._structPlane.visible);
  scene.setExploded(false, true);
  log('exploded off: back to ground and previous camera', scene.plantMeshes.every((m) => m.position.y === 0) && scene.cam.position.distanceTo(camBefore) < 1e-3 && !scene._structPlane.visible);

  // ---- draft never mutates the baseline
  const pid = 'pl.A1.b01'; const before = JSON.stringify(GP.getObject(pid));
  GP.applyPatch([{ op: 'set', target: pid, path: 'speciesIds', value: ['sp.sporobolus-heterolepis'] }]);
  const draftVal = GP.getObject(pid).speciesIds[0];
  log('applyPatch changes the draft', draftVal === 'sp.sporobolus-heterolepis');
  log('baseline unchanged after patch', JSON.stringify(S.baseline.placements.find((p) => p.id === pid)) === before);
  log('exportModel() returns the baseline by default', JSON.parse(GP.exportModel()).placements.find((p) => p.id === pid).speciesIds[0] !== 'sp.sporobolus-heterolepis');
  GP.resetDraft();
  log('resetDraft restores', JSON.stringify(GP.getObject(pid)) === before && GP.diffDraft().length === 0);

  // ======================================================================== Phase 01.1
  // ---- 10 · baseline files untouched (bytes) and reference rows untouched (memory)
  const HASH = { 'model.json': 'b7bc3689929d91f469a58a6592aee689048a671fbcff1d499729ccf641ce7d7b', 'instances.bin': '1bf31385f064f540d3ec68d4855fe92eaf370af7f21ca16da5cb2b8d9483bdf7' };
  for (const f of Object.keys(HASH)) {
    const buf = await (await fetch(base + 'data/detroit/' + f, { cache: 'no-store' })).arrayBuffer();
    const h = [...new Uint8Array(await crypto.subtle.digest('SHA-256', buf))].map((b) => b.toString(16).padStart(2, '0')).join('');
    log('baseline ' + f + ' SHA-256 unchanged', h === HASH[f], h);
  }
  const refFP = JSON.stringify(S.refInst.fingerprint());
  try { w.localStorage.clear(); } catch {}
  GP.discardDraft();
  const ui = GP._ui; const doc = w.document; const picker = scene.picker;

  // ---- 01 · site vs design: three reachable states, hide != delete, blank canvas scope
  log('starts in Reference (reference scenario)', GP.mode() === 'reference' && GP.scenario() === 'reference');
  const nRefPl = S.model.placements.length, terrainMesh = scene.terrain;
  GP._store.setViewState({ hidePlanting: true });
  log('Hide reference planting = visibility only (placements kept, still queryable)', S.model.placements.length === nRefPl && !S.layerVisible('structure.patches') && GP.queryObjects({ type: 'Point', coordinates: cen }, { collection: 'placements' }).length > 0);
  GP._store.setViewState({ hidePlanting: false });
  const pv = GP.blankScopePreview();
  log('blank-design preview lists what will be cleared before it runs', pv.clears.units.length === 15 && pv.clears.placements > 1000 && pv.keeps.existingTrees && pv.keeps.bedFramework, JSON.stringify(pv.clears).slice(0, 120));
  const liveRef = S.liveCount, siteTreesRef = (() => { let n = 0; for (let i = 0; i < S.inst.n; i++) if (S.inst.alive[i] && S.inst.pl[i] < 0) n++; return n; })();
  const rgRef = S.placementsByBed.get('bed.RG').length;
  doc.querySelector('.modes [data-m=canvas]').click();
  const dlg = doc.getElementById('draftdlg');
  log('Canvas without a draft opens the scope dialog (nothing created yet)', !dlg.hidden && !GP.draftInfo() && /Clears/.test(dlg.innerText));
  dlg.querySelector('[data-a=go]').click(); await sleep(50);
  log('Start design (blank) -> Canvas on a working scenario', GP.mode() === 'canvas' && GP.scenario() === 'working' && GP.draftInfo().from === 'blank');
  const b1ctx = GP.getPlantingContext('bed.B1');
  log('blank canvas: B1 has no active placements or proxies', b1ctx.placementCount === 0 && b1ctx.instanceCount === 0, JSON.stringify(b1ctx.placementsByRole));
  log('blank canvas: cleared proxies leave queries and counts', S.liveCount === liveRef - pv.clears.instances && GP.queryObjects({ type: 'Point', coordinates: cen, radius: 2 }, { collection: 'instances' }).length === 0, S.liveCount + ' vs ' + (liveRef - pv.clears.instances));
  const siteTreesW = (() => { let n = 0; for (let i = 0; i < S.inst.n; i++) if (S.inst.alive[i] && S.inst.pl[i] < 0) n++; return n; })();
  log('blank canvas keeps site trees, Rain Garden, paths, bed framework', siteTreesW === siteTreesRef && S.placementsByBed.get('bed.RG').length === rgRef && !!GP.getObject('built.gravel-walks') && S.beds.length === 20);
  log('3D follows the working design (rendered proxies = live rows in view)', scene.renderedInstances() === S.liveCount, scene.renderedInstances() + ' / ' + S.liveCount);
  log('site model not reloaded when the design state changes (same terrain mesh)', scene.terrain === terrainMesh);
  GP.setMode('reference');
  log('Reference still complete after a blank draft exists', GP.getPlantingContext('bed.B1').placementCount === b1ctx.placementCount + GP._store.baseline.placements.filter((p) => p.bedId === 'bed.B1').length && S.liveCount === liveRef);
  GP.setMode('terrain');
  log('Terrain: plants and built forms hidden in 3D, contours on, nothing deleted', scene.plantMeshes.every((m) => !m.visible) && S.layerVisible('topo.contours') && S.model.objects.length === 87 && S.liveCount === liveRef);
  const bw = GP.getObject('built.east-meadow-boardwalk'); const bwc = (() => { const r = bw.geometry.type === 'Polygon' ? bw.geometry.coordinates[0] : bw.geometry.coordinates[0][0]; return [(r[0][0] + r[1][0]) / 2, (r[0][1] + r[1][1]) / 2]; })();
  const pb = GP.plantableAt(bwc[0], bwc[1]);
  log('Terrain: hidden boardwalk (inside East Meadow) still blocks planting', !S.layerVisible('built.structures') && pb.value === false && /boardwalk/.test(pb.reason), JSON.stringify(pb));
  GP.setMode('canvas');
  log('draft survives Reference/Terrain switches', GP.draftInfo() && GP.draftInfo().from === 'blank' && GP.getPlantingContext('bed.B1').placementCount === 0);

  // ---- 03 · real edit loop on a copy of the reference (B1, non-matrix group found in the data)
  GP.createDraft({ from: 'reference' });
  const g = S.model.placements.filter((p) => p.bedId === 'bed.B1' && p.role === 'group' && p.speciesIds.length === 1).sort((a, b) => b.areaM2 - a.areaM2)[0];
  const NEW = 'sp.achillea-moonshine', OLD = g.speciesIds[0];
  const rowsG = S.instancesOfPlacement(g.id);
  log('B1 group chosen from data: ' + g.id + ' (' + OLD + ', ' + rowsG.length + ' proxies)', g.role === 'group' && rowsG.length > 0);
  const tB = S.speciesTally({ bedId: 'bed.B1' }), rB = scene.renderedSpeciesCounts(), fB = scene.formOfInstance(rowsG[0]);
  // plan pixel at a proxy core, before
  GP.setView('plan'); await sleep(50);
  const px = async (i) => { plan.view.cx = S.ix(i); plan.view.cy = S.iy(i); plan.view.scale = 90; plan.drawNow(); const [qx, qy] = plan.T(S.ix(i), S.iy(i)); const d = plan.ctx.getImageData(Math.round(qx * plan.dpr), Math.round(qy * plan.dpr), 1, 1).data; return [d[0], d[1], d[2]]; };
  GP.select(null); S.setHover(null);
  const pxB = await px(rowsG[0]);
  const rp = GP.applyPatch([{ op: 'replaceSpecies', target: g.id, speciesIds: [NEW] }]);
  const tA = S.speciesTally({ bedId: 'bed.B1' }), rA = scene.renderedSpeciesCounts(), fA = scene.formOfInstance(rowsG[0]);
  log('replace: patch ok, same proxy ids changed species', rp.ok && rp.changes.instancesChanged === rowsG.length && rowsG.every((i) => GP.getObject('pi.' + i).speciesId === NEW), JSON.stringify(rp.changes));
  log('replace: model tally in B1 moved ' + rowsG.length + ' proxies', (tA[NEW] || 0) - (tB[NEW] || 0) === rowsG.length && (tB[OLD] || 0) - (tA[OLD] || 0) === rowsG.length);
  log('replace: 3D rendered species counts changed the same way', (rA[NEW] || 0) - (rB[NEW] || 0) === rowsG.length && (rB[OLD] || 0) - (rA[OLD] || 0) === rowsG.length, JSON.stringify([rB[NEW], rA[NEW], rB[OLD], rA[OLD]]));
  log('replace: 3D form and colour of the proxy changed (not a label)', fB && fA && (fB.form !== fA.form || fB.leaf.join() !== fA.leaf.join()), JSON.stringify([fB && fB.form, fA && fA.form]));
  const pxA = await px(rowsG[0]);
  log('replace: plan symbol colour at the proxy changed', Math.hypot(pxA[0] - pxB[0], pxA[1] - pxB[1], pxA[2] - pxB[2]) > 20, JSON.stringify([pxB, pxA]));
  log('replace: point query + species query return the new species', GP.queryObjects({ type: 'Point', coordinates: [S.ix(rowsG[0]), S.iy(rowsG[0])], radius: 0.02 }, { collection: 'instances' })[0].speciesId === NEW && GP.queryObjects({ bbox: [-500, -500, 500, 500] }, { collection: 'placements', speciesId: NEW, bedId: 'bed.B1' }).some((p) => p.id === g.id));
  GP.select(g.id); await sleep(30);
  log('replace: inspector shows the new species', doc.getElementById('inspector').innerText.includes('Achillea'));
  GP.select(null);
  const exA = GP.exportDraft();
  log('replace: export carries the instance change', exA.instanceDelta.speciesChanged.length === rowsG.length && exA.recipe.ops.length === 1);
  // remove
  const g2 = S.model.placements.find((p) => p.bedId === 'bed.B1' && p.role === 'emergent');
  const rows2 = S.instancesOfPlacement(g2.id); const liveB = S.liveCount, rendB = scene.renderedInstances();
  const pr = GP.applyPatch([{ op: 'remove', target: g2.id }]);
  const at2 = g2.geometry.coordinates;
  log('remove: placement + proxies gone from model, index, render', pr.ok && !GP.getObject(g2.id) && rows2.every((i) => !GP.getObject('pi.' + i)) && S.liveCount === liveB - rows2.length && scene.renderedInstances() === rendB - rows2.length);
  log('remove: not returned by queries or picking', GP.queryObjects({ type: 'Point', coordinates: at2, radius: 0.05 }, { collection: 'placements' }).every((p) => p.id !== g2.id) && !(S.getPlacementsAt(at2[0], at2[1]).some((p) => p.id === g2.id)));
  // add
  const b1 = GP.getObject('bed.B1'); const cB1 = (() => { const r = b1.geometry.coordinates[0]; let x = 0, y = 0; r.slice(0, -1).forEach((q) => { x += q[0]; y += q[1]; }); return [x / (r.length - 1), y / (r.length - 1)]; })();
  const sq = { type: 'Polygon', coordinates: [[[cB1[0] - 0.7, cB1[1] - 0.7], [cB1[0] + 0.7, cB1[1] - 0.7], [cB1[0] + 0.7, cB1[1] + 0.7], [cB1[0] - 0.7, cB1[1] + 0.7], [cB1[0] - 0.7, cB1[1] - 0.7]]] };
  const ad = GP.applyPatch([{ op: 'add', collection: 'placements', value: { bedId: 'bed.B1', role: 'group', speciesIds: ['sp.echinacea-hula-dancer'], geometry: sq, legendCode: 'ECH' } }]);
  const nid = ad.ok && ad.changes.placementsAdded[0];
  log('add: new placement with seeded proxies', ad.ok && ad.changes.instancesAdded.length > 0 && GP.getObject(nid).status === 'draft', JSON.stringify(ad.errors || ad.changes.instancesAdded));
  picker.scope = 'composition'; const pk2 = picker.resolve(cB1[0], cB1[1], 40); picker.scope = null;
  log('add: clickable (picker returns it) and rendered', pk2 && pk2.id === nid && (scene.renderedSpeciesCounts()['sp.echinacea-hula-dancer'] || 0) >= ad.changes.instancesAdded.length, JSON.stringify(pk2));
  const ad2 = GP.applyPatch([{ op: 'add', collection: 'placements', value: { bedId: 'bed.B1', role: 'group', speciesIds: ['sp.echinacea-hula-dancer'], geometry: { type: 'Polygon', coordinates: [[[0, -80], [1, -80], [1, -79], [0, -79], [0, -80]]] } } }]);
  log('add outside the bed is rejected (E_OUTSIDE)', !ad2.ok && ad2.errors[0].code === 'E_OUTSIDE');
  // atomic + permission
  const fpPre = JSON.stringify(S.inst.fingerprint()), nPre = S.model.placements.length;
  const bad = GP.applyPatch([{ op: 'remove', target: g.id }, { op: 'set', target: g.id, path: '__proto__.polluted', value: 1 }]);
  log('atomic: one bad op rolls back the whole batch', !bad.ok && JSON.stringify(S.inst.fingerprint()) === fpPre && S.model.placements.length === nPre && !!GP.getObject(g.id) && ({}).polluted === undefined);
  log('site objects are read-only in a planting draft', GP.applyPatch([{ op: 'set', target: 'bed.B1', path: 'props.style', value: 'A' }]).errors[0].code === 'E_READONLY');
  log('unknown species rejected', GP.applyPatch([{ op: 'replaceSpecies', target: g.id, speciesIds: ['sp.not-in-model'] }]).errors[0].code === 'E_SPECIES');
  GP.setLayer('structure.patches', { locked: true });
  const uiLocked = GP.applyPatch([{ op: 'set', target: g.id, path: 'note', value: 'ui lock is not a model permission' }]);
  GP.setLayer('structure.patches', { locked: false });
  GP.setEditLock('bed.B1', true);
  const mLocked = GP.applyPatch([{ op: 'set', target: g.id, path: 'note', value: 'x' }]);
  GP.setEditLock('bed.B1', false);
  log('UI layer lock != model permission; model edit-lock blocks patches', uiLocked.ok && !mLocked.ok && mLocked.errors[0].code === 'E_LOCKED');
  const dry = GP.applyPatch([{ op: 'remove', target: g.id }], { dryRun: true });
  log('dryRun validates without changing anything', dry.ok && dry.dryRun && !!GP.getObject(g.id));
  // export / import / reset
  const ex = GP.exportDraft(); const fpD = JSON.stringify(S.inst.fingerprint());
  GP.discardDraft(); const imp = GP.importDraft(ex);
  log('export -> import rebuilds the same instance state', imp.ok && imp.fingerprintMatches && JSON.stringify(S.inst.fingerprint()) === fpD);
  GP.resetDraft();
  log('reset: working design equals the reference again (rows, species, placements)', JSON.stringify(S.inst.fingerprint()) === refFP && GP.diffDraft().length === 0 && GP.getObject(g.id).speciesIds[0] === OLD && !!GP.getObject(g2.id));
  log('reference rows never touched by any edit', JSON.stringify(S.refInst.fingerprint()) === refFP);

  // ---- 04 · exact spatial queries
  GP.discardDraft();
  const A1 = GP.getObject('bed.A1'); const bA = S.bedBoxes.get('bed.A1');
  const eR = A1.geometry.coordinates[0]; const em = [(eR[0][0] + eR[1][0]) / 2, (eR[0][1] + eR[1][1]) / 2]; // a point on A1's real (slanted) edge
  const edgeBox = { bbox: [em[0] - 0.5, em[1] - 0.5, em[0] + 0.5, em[1] + 0.5] };
  const ebPoly = { type: 'Polygon', coordinates: [[[edgeBox.bbox[0], edgeBox.bbox[1]], [edgeBox.bbox[2], edgeBox.bbox[1]], [edgeBox.bbox[2], edgeBox.bbox[3]], [edgeBox.bbox[0], edgeBox.bbox[3]], [edgeBox.bbox[0], edgeBox.bbox[1]]]] };
  log('polygon crossing a bed edge (centroid outside) intersects it', GP.queryObjects(ebPoly, { type: 'bed' }).some((o) => o.id === 'bed.A1'));
  log('… but A1 is not within that polygon', !GP.queryObjects(ebPoly, { type: 'bed', predicate: 'within' }).some((o) => o.id === 'bed.A1'));
  const big = [bA[0] - 30, bA[1] - 30, bA[2] + 30, bA[3] + 30];
  const holed = { type: 'Polygon', coordinates: [[[big[0], big[1]], [big[2], big[1]], [big[2], big[3]], [big[0], big[3]], [big[0], big[1]]], [[bA[0] - 1, bA[1] - 1], [bA[0] - 1, bA[3] + 1], [bA[2] + 1, bA[3] + 1], [bA[2] + 1, bA[1] - 1], [bA[0] - 1, bA[1] - 1]]] };
  log('polygon hole: a bed entirely inside the hole is not returned', !GP.queryObjects(holed, { type: 'bed' }).some((o) => o.id === 'bed.A1') && GP.queryObjects(holed, { type: 'bed' }).length > 3);
  const C3 = GP.getObject('bed.C3'); const bC = S.bedBoxes.get('bed.C3');
  const sqAt = (b, k = 0.5) => { const x = (b[0] + b[2]) / 2, y = (b[1] + b[3]) / 2; return [[[x - k, y - k], [x + k, y - k], [x + k, y + k], [x - k, y + k], [x - k, y - k]]]; };
  const mp = GP.queryObjects({ type: 'MultiPolygon', coordinates: [sqAt(bA), sqAt(bC)] }, { type: 'bed' }).map((o) => o.id);
  log('MultiPolygon query returns both beds', mp.includes('bed.A1') && mp.includes('bed.C3') && mp.length === 2, mp.join());
  const line = { type: 'LineString', coordinates: [[(bA[0] + bA[2]) / 2, (bA[1] + bA[3]) / 2], [(bC[0] + bC[2]) / 2, (bC[1] + bC[3]) / 2]] };
  const lr = GP.queryObjects(line, { type: 'bed' }).map((o) => o.id);
  log('LineString query returns every bed it crosses', lr.includes('bed.A1') && lr.includes('bed.C3') && lr.length >= 3, lr.join());
  const ml = GP.queryObjects({ type: 'MultiLineString', coordinates: [line.coordinates, [[bA[0] - 5, bA[1] - 5], [bA[0] - 4, bA[1] - 5]]] }, { type: 'bed' }).length;
  log('MultiLineString query', ml === lr.length);
  log('boundary contact counts as intersecting (bed outline as a line)', GP.queryObjects({ type: 'LineString', coordinates: A1.geometry.coordinates[0].slice(0, 2) }, { type: 'bed' }).some((o) => o.id === 'bed.A1'));
  const bf = (x, y, r) => { let n = 0; for (let i = 0; i < S.inst.n; i++) if (S.inst.alive[i] && Math.hypot(S.inst.x[i] - x, S.inst.y[i] - y) <= r + 1e-3) n++; /* documented 1 mm closed-boundary tolerance */ return n; };
  log('point + 7 m radius = brute-force set incl. the 1 mm boundary tolerance (radius-correct index)', GP.queryInstances({ type: 'Point', coordinates: cen, radius: 7 }).length === bf(cen[0], cen[1], 7), GP.queryInstances({ type: 'Point', coordinates: cen, radius: 7 }).length + ' vs ' + bf(cen[0], cen[1], 7));
  const far = S.nearestInstance(cen[0] + 40, cen[1] + 40, 60);
  log('nearestInstance with a large radius finds instances beyond the 3×3 cells', far >= 0);
  log('bbox candidates are flagged as not exact', GP.query({ bbox: edgeBox.bbox, candidates: true }, { type: 'bed' }).exact === false && GP.query(edgeBox, { type: 'bed' }).exact === true);
  const sc0 = GP.sampleConditions(5000, 5000);
  log('outside the extent: elevation / slope / distance null + unknown', sc0['field.elevation'].value === null && sc0['field.slope'].value === null && sc0['field.distance-to-path'].value === null && sc0.inExtent === false);
  const sc1 = GP.sampleConditions(cen[0], cen[1]);
  log('conditions carry definitions, units and sources', /3DEP/.test(sc1['field.elevation'].definition) && sc1['field.slope'].units === 'deg' && /path/.test(sc1['field.distance-to-path'].definition));
  log('distance-to-path set comes from case.json path types, not hard-coded ids', S.pathObjects().every((o) => o.type === 'path') && S.pathObjects().length >= 2);
  log('vertical exaggeration never enters the data (z in m NAVD88)', Math.abs(sc1['field.elevation'].value - S.sampleElevation(cen[0], cen[1])) < 0.01 && sc1['field.elevation'].value > 170);
  GP.setLayer('built.structures', { visible: false });
  const pb2 = GP.plantableAt(bwc[0], bwc[1]), pm = GP.plantableAt(bwc[0] + 6, bwc[1] + 6);
  log('hidden layer still blocks planting; plantable / hidden / locked are separate', pb2.value === false && GP.layers()['built.structures'].visible === false && GP.layers()['built.structures'].locked === false, JSON.stringify([pb2, pm]));
  GP.setLayer('built.structures', { visible: true });
  log('matrix and group overlap at a point (no one-plant-per-cell)', GP.sampleConditions(...(() => { const r = S.instancesOfPlacement(g.id)[0]; return [S.ix(r), S.iy(r)]; })()).placements.length >= 2);

  // ---- 08 · layer navigation: real clicks on the exploded plates
  GP.setView('3d'); await sleep(50);
  const camW = scene.cam.position.clone(), zW = scene.cam.zoom;
  doc.querySelector('.views [data-v=layers]').click(); await sleep(1200);
  log('Layers view: six physical plates, analysis as plan-only entry', Object.keys(scene._plates).length === 6 && doc.querySelectorAll('.plabel').length === 7);
  log('Layers view: no cross-layer shadows', scene.sun.castShadow === false);
  const THREE_V = scene.cam.position.constructor;
  const clickPlate = async (gid) => {
    const yy = scene._plateY(gid) + (gid === 'terrain' ? scene.hY(0, -48) : 0.4);
    const v = new THREE_V(0, yy, 48).project(scene.cam); // 4 m inside the south edge of the crop
    const r = scene.c.getBoundingClientRect(); const cx = r.left + (v.x * 0.5 + 0.5) * r.width, cy = r.top + (-v.y * 0.5 + 0.5) * r.height;
    scene.c.dispatchEvent(new w.PointerEvent('pointerdown', { clientX: cx, clientY: cy, bubbles: true }));
    scene.c.dispatchEvent(new w.PointerEvent('pointerup', { clientX: cx, clientY: cy, bubbles: true }));
    await sleep(30);
  };
  await clickPlate('composition');
  log('click on the composition plate focuses it, others dim', ui.plateFocus === 'composition' && scene._plates.framework.mesh.material.opacity < 0.5 && scene._plates.composition.mesh.material.opacity === 1, ui.plateFocus);
  await clickPlate('infrastructure');
  log('click on the infrastructure plate moves the focus', ui.plateFocus === 'infrastructure', ui.plateFocus);
  const camL = scene.cam.position.clone();
  doc.querySelector('#platecard [data-a=open]').click(); await sleep(60);
  log('Open in Plan: isolated orthographic layer, breadcrumb, legend', GP.view() === 'plan' && GP.isolation().group === 'infrastructure' && /Infrastructure/.test(doc.getElementById('crumbs').innerText) && !doc.getElementById('legend').hidden && /Infrastructure/.test(doc.getElementById('legend').innerText));
  const sx = (() => { const r = GP.getObject('built.gravel-walks').geometry.coordinates[0]; return [(r[0][0] + r[1][0]) / 2, (r[0][1] + r[1][1]) / 2]; })();
  const hitPath = picker.resolve(sx[0], sx[1], 20);
  log('isolated layer: selection limited to that layer (path, not bed)', hitPath && GP.getObject(hitPath.id).type === 'path', JSON.stringify(hitPath));
  GP.openLayer('composition'); await sleep(30);
  GP.setOverlay('framework', 0.5);
  const hp = picker.resolve(cen[0], cen[1], 20);
  log('reference overlay (framework) does not steal the click', hp && GP._store.kindOf(hp.id) === 'placement', JSON.stringify(hp));
  log('overlay opacity is applied', GP.isolation().overlays.framework === 0.5);
  doc.querySelector('#crumbs [data-a=back]').click(); await sleep(900);
  log('Back returns to the Layers overview with its camera', GP.view() === 'layers' && scene.cam.position.distanceTo(camL) < 1e-3 && !GP.isolation(), JSON.stringify({ view: GP.view(), d: scene.cam.position.distanceTo(camL), iso: GP.isolation() }));
  doc.querySelector('#crumbs [data-a=back]').click(); await sleep(50);
  w.dispatchEvent(new w.KeyboardEvent('keydown', { key: 'Escape' })); await sleep(1100);
  log('Esc returns to World and restores the world camera', GP.view() === '3d' && scene.cam.position.distanceTo(camW) < 1e-3 && Math.abs(scene.cam.zoom - zW) < 1e-6, scene.cam.position.distanceTo(camW));
  log('layer visibility restored after leaving the isolated plan', S.layerState['built.paths'].visible === true && S.layerState['analysis.slope'].visible === false);
  GP.openLayer('analysis'); await sleep(30);
  log('Analysis isolated: real slope shown, sun / moisture / pH marked no data', S.layerVisible('analysis.slope') && (doc.getElementById('legend').innerText.match(/no data/g) || []).length >= 3);
  GP.closeLayer(); GP.setView('3d');

  // ---- 09 · interface
  log('view switch and design-state switch are separate controls', doc.querySelector('.views') && doc.querySelector('.modes') && doc.querySelector('.views').contains(doc.querySelector('[data-m]')) === false);
  log('Reference status keeps “Schematic reconstruction · not a survey”', /Schematic reconstruction · not a survey/.test(doc.getElementById('note').innerText));
  GP.select(null);
  log('no inspector without a selection', doc.getElementById('inspector').hidden);
  const vp = w.innerWidth * w.innerHeight; let ui2 = 0;
  for (const s of ['.top .brand', '.views', '.right', '#layers', '#note']) { const e = doc.querySelector(s); if (!e || e.hidden) continue; const r = e.getBoundingClientRect(); ui2 += r.width * r.height; }
  log('model keeps ≥ 80% of the screen by default', 1 - ui2 / vp >= 0.8, (100 * (1 - ui2 / vp)).toFixed(1) + '%');
  w.dispatchEvent(new w.KeyboardEvent('keydown', { key: '3' })); await sleep(900);
  log('key 3 opens Layers, Esc goes back', GP.view() === 'layers');
  w.dispatchEvent(new w.KeyboardEvent('keydown', { key: 'Escape' })); await sleep(900);
  GP.discardDraft(); try { w.localStorage.clear(); } catch {}

  // ---- rendering sanity
  scene.renderNow();
  const st = scene.stats();
  log('3D renders triangles', st.triangles > 10000, JSON.stringify(st));
  log('no horizontal overflow at 1440×900', w.document.documentElement.scrollWidth <= w.innerWidth + 1, w.document.documentElement.scrollWidth);
  log('no runtime errors (desktop)', errors.length === 0, errors.slice(0, 3).join(' | '));

  // ---- phone viewport
  const P = await boot(document.getElementById('phone'), base + 'index.html?view=plan');
  log('phone: app loads', !!P.GP);
  const d = P.w.document.documentElement;
  log('phone: no horizontal overflow (390 px)', d.scrollWidth <= P.w.innerWidth + 1, d.scrollWidth + ' > ' + P.w.innerWidth);
  const lay = P.w.document.getElementById('layers').getBoundingClientRect();
  log('phone: layer panel fits the width', lay.right <= P.w.innerWidth && lay.left >= 0, JSON.stringify(lay));
  log('no runtime errors (phone)', P.errors.length === 0, P.errors.slice(0, 3).join(' | '));

  const ok = res.filter((r) => r.ok).length;
  document.getElementById('summary').textContent = `${ok}/${res.length} passed · app load ${Math.round(loadMs)} ms`;
  document.body.dataset.done = '1';
  window.__results = { ok, total: res.length, loadMs, results: res, ua: navigator.userAgent };
  document.getElementById('summary').dataset.json = JSON.stringify(window.__results);
} catch (e) {
  log('test harness error', false, e.stack || e);
  document.getElementById('summary').textContent = 'harness error';
  document.body.dataset.done = '1';
  document.getElementById('summary').dataset.json = JSON.stringify({ ok: 0, total: res.length, error: String(e), results: res });
}
</script>
</body>
</html>
