<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Generative Planting — Design</title>
<meta name="description" content="Generative Planting · Site setup: the spatial input of an AI-assisted planting design tool. Load a site preset, read its terrain, infrastructure and planting framework, and start a working design from the reference planting or a blank one.">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%27http://www.w3.org/2000/svg%27 viewBox=%270 0 16 16%27%3E%3Ccircle cx=%278%27 cy=%278%27 r=%275.5%27 fill=%27%23859779%27 fill-opacity=%27.55%27/%3E%3Ccircle cx=%278%27 cy=%278%27 r=%272%27 fill=%27%23506B5F%27/%3E%3C/svg%3E">
<link rel="stylesheet" href="src/app.css">
<link rel="stylesheet" href="src/design/design.css">
<script type="importmap">
{ "imports": { "three": "./vendor/three/three.module.js", "three/addons/": "./vendor/three/addons/" } }
</script>
</head>
<body>
<div id="app" data-view="3d" data-design="reference">
  <canvas id="c3d" aria-label="Spatial canvas, axonometric"></canvas>
  <canvas id="c2d" aria-label="Spatial canvas, plan"></canvas>
  <div id="labels3d" aria-hidden="true"></div>
  <div id="platelabels" role="list" aria-label="Layer stack"></div>
  <div id="hovertag" aria-hidden="true" hidden></div>

  <header class="bar">
    <nav class="where" aria-label="Location">
      <span class="product">Generative Planting</span>
      <span class="sep" aria-hidden="true">/</span>
      <span class="module">Site setup</span>
      <button class="site" id="btnSite" title="About this site preset and its data" aria-haspopup="dialog"><span id="siteName">Site</span><svg viewBox="0 0 12 12" width="10" height="10" aria-hidden="true"><path d="M3 4.5 6 7.5 9 4.5" fill="none" stroke="currentColor" stroke-width="1.3"/></svg></button>
    </nav>
    <div class="design" id="design">
      <span class="lbl" id="designLbl">Design</span>
      <div class="seg" role="radiogroup" aria-labelledby="designLbl">
        <button role="radio" data-d="reference" aria-checked="true" title="The original planting, reconstructed. Read-only.">Reference</button>
        <button role="radio" data-d="working" aria-checked="false" id="btnWorking" title="Your editable planting design">New design</button>
      </div>
      <button class="icon more" id="btnDesignMenu" aria-label="Working design options" aria-haspopup="menu" aria-expanded="false" hidden>
        <svg viewBox="0 0 20 20" width="16" height="16" aria-hidden="true"><circle cx="5" cy="10" r="1.4" fill="currentColor"/><circle cx="10" cy="10" r="1.4" fill="currentColor"/><circle cx="15" cy="10" r="1.4" fill="currentColor"/></svg>
      </button>
      <div class="menu" id="designMenu" role="menu" hidden>
        <button role="menuitem" data-a="export">Export working design</button>
        <button role="menuitem" data-a="knowledge">Open the Knowledge workspace</button>
        <button role="menuitem" data-a="new">Start a new design…</button>
        <button role="menuitem" data-a="reset">Undo all changes</button>
        <button role="menuitem" data-a="discard" class="danger">Delete working design</button>
      </div>
    </div>
  </header>

  <aside class="layers" id="layers" aria-label="Layers" hidden>
    <div class="lp-head">
      <h2>Layers</h2>
      <button class="icon x" id="btnLayersClose" aria-label="Close layers">
        <svg viewBox="0 0 16 16" width="13" height="13" aria-hidden="true"><path d="M4 4l8 8M12 4l-8 8" stroke="currentColor" stroke-width="1.5"/></svg>
      </button>
    </div>
    <div class="filters" role="radiogroup" aria-label="Show">
      <button role="radio" data-f="all" aria-checked="true">Everything</button>
      <button role="radio" data-f="site" aria-checked="false" title="Hide the planting design; keep the site">Site only</button>
      <button role="radio" data-f="terrain" aria-checked="false" title="Ground surface, contours and boundary only">Terrain</button>
    </div>
    <div class="ltree" id="ltree" role="list"></div>
    <section class="legend" id="legend" aria-live="polite" hidden></section>
    <div class="lp-foot">
      <button class="btn ghost" id="btnExplode" aria-pressed="false" title="Pull the layers apart in 3D (E)">
        <svg viewBox="0 0 20 20" width="15" height="15" aria-hidden="true"><path d="M10 2.8 3 6l7 3.2L17 6l-7-3.2ZM3 10l7 3.2L17 10M3 14l7 3.2 7-3.2" fill="none" stroke="currentColor" stroke-width="1.3" stroke-linejoin="round"/></svg>
        <span>Exploded view</span>
      </button>
    </div>
  </aside>

  <aside class="inspector compact" id="inspector" hidden aria-label="Selection"></aside>
  <aside class="conditions" id="conditions" hidden aria-labelledby="condTitle"></aside>
  <div class="entry" id="entry" role="dialog" aria-label="Site preset" hidden></div>

  <div class="toolbar" role="toolbar" aria-label="Canvas">
    <div class="seg obs" role="radiogroup" aria-label="View">
      <button role="radio" data-v="3d" aria-checked="true" title="Axonometric (1)">Axo</button>
      <button role="radio" data-v="plan" aria-checked="false" title="Plan, orthographic (2)">Plan</button>
    </div>
    <button class="tool" id="btnLayers" aria-pressed="false" aria-controls="layers" title="Layers (L)">
      <svg viewBox="0 0 20 20" width="16" height="16" aria-hidden="true"><path d="M10 3 2.5 7 10 11l7.5-4L10 3Z M2.5 10.5 10 14.5l7.5-4M2.5 13.8 10 17.8l7.5-4" fill="none" stroke="currentColor" stroke-width="1.3" stroke-linejoin="round"/></svg>
      <span>Layers</span>
    </button>
    <button class="tool icon-only" id="btnFit" title="Reset view (F)" aria-label="Reset view">
      <svg viewBox="0 0 20 20" width="16" height="16" aria-hidden="true"><path d="M3 7V3h4M13 3h4v4M17 13v4h-4M7 17H3v-4" fill="none" stroke="currentColor" stroke-width="1.5"/></svg>
    </button>
  </div>

  <div class="compass" id="compass" title="North" aria-hidden="true"><svg viewBox="0 0 24 24" width="24" height="24"><path d="M12 2.5 15.5 13 12 11 8.5 13Z" fill="currentColor"/><path d="M12 21.5 15.5 13 12 11 8.5 13Z" fill="none" stroke="currentColor" stroke-width="1"/></svg></div>
  <div class="status" id="status"><span id="coords" class="mono" hidden></span><span id="note"></span></div>

  <div class="sheet" id="about" role="dialog" aria-label="About this site" hidden></div>
  <div class="dialog" id="draftdlg" role="dialog" aria-modal="true" aria-labelledby="dlgTitle" hidden></div>
  <div class="loading" id="loading"><div class="dot"></div><span>Loading site…</span></div>
</div>
<script type="module" src="src/app.js"></script>
</body>
</html>
